name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test financial logic and account isolation
        run: dotnet test ExpenseTracker.Tests/ExpenseTracker.Tests.csproj --configuration Release

  build:
    needs: tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            workload: maui-windows
            framework: net10.0-windows10.0.19041.0
          - platform: Android
            workload: maui-android
            framework: net10.0-android
    name: ${{ matrix.platform }} release compilation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install platform workload
        run: dotnet workload install ${{ matrix.workload }}
      - name: Build the supported target
        run: >-
          dotnet build ExpenseTracker.csproj --configuration Release
          --framework ${{ matrix.framework }}
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:WindowsPackageType=None

      # Compilation is not publication. Signed distribution uses the release scripts.
